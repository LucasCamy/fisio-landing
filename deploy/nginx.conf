server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # .avif expl�cito (nem toda vers�o do mime.types mapeia)
  include /etc/nginx/mime.types;
  types { image/avif avif; }

  # nginx:stable-alpine ainda não mapeia .avif em todas as versões
  types {
    image/avif avif;
  }
  include /etc/nginx/mime.types;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok";
  }

  # Arquivos com hash no nome (Vite)
  location /assets/ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  # Mídia versionada por ?v=<hash do conteúdo>
  location /media/ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "public, max-age=2592000, no-transform" always;
    try_files $uri =404;
  }

  location ~* \.html$ {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/conf.d/security-headers.inc;
    add_header Cache-Control "no-cache" always;
    try_files $uri $uri/ /index.html;
  }
}
